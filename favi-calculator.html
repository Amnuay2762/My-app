<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favipiravir Dosage Calculator</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg); color: var(--text-main); padding: 15px; margin: 0; display: flex; justify-content: center; }

        .container { background-color: var(--card); border-radius: 16px; padding: 25px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .header h1 { color: var(--primary-dark); margin: 0 0 5px 0; font-size: 24px; }
        .header p { color: var(--text-muted); margin: 0; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; }

        /* Radio Buttons (เม็ด/น้ำ) */
        .radio-group { display: flex; gap: 10px; }
        .radio-card { flex: 1; border: 2px solid #e2e8f0; border-radius: 8px; padding: 12px 5px; text-align: center; cursor: pointer; transition: 0.2s; font-weight: bold; color: var(--text-muted); font-size: 15px; }
        .radio-card input { display: none; }
        .radio-card.active { border-color: var(--primary); background-color: #f0f9ff; color: var(--primary); }

        input[type="number"] { width: 100%; padding: 14px 15px; font-size: 20px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.2s; background: #f8fafc; font-weight: bold; text-align: center;}
        input[type="number"]:focus { border-color: var(--primary); background: #fff; }

        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(14, 165, 233, 0.2); }
        button:hover { background-color: var(--primary-dark); transform: translateY(-1px); }

        /* Result Section */
        .result-box { display: none; margin-top: 25px; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .dosage-card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative; overflow: hidden; }
        .dosage-card::before { content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background-color: var(--primary); }
        .dosage-card.day2-5::before { background-color: var(--success); }

        .dose-title { font-size: 15px; font-weight: bold; color: #334155; margin-bottom: 10px; }
        .dose-detail { display: flex; justify-content: space-between; align-items: center; }
        .dose-mg { color: var(--text-muted); font-size: 14px; }
        .dose-val { font-size: 26px; font-weight: 800; color: var(--primary-dark); text-align: right; }
        .dose-unit { font-size: 14px; font-weight: normal; color: var(--text-muted); }

        .total-box { background-color: #fff8f1; border: 2px dashed #fde047; border-radius: 12px; padding: 15px; text-align: center; margin-top: 20px; }
        .total-title { font-size: 15px; color: #92400e; font-weight: 600; margin-bottom: 5px; }
        .total-num { font-size: 26px; font-weight: 800; color: #d97706; margin-bottom: 5px;}
        
        /* สไตล์สำหรับกล่องระบุขนาดยาน้ำที่ต้องจัดให้ผู้ป่วย (เด่นๆ) */
        .bottle-dispense { 
            font-size: 22px; 
            font-weight: 900; 
            color: #b91c1c; 
            margin-top: 15px; 
            background: #fef2f2; 
            border: 2px dashed #ef4444; 
            display: block; 
            padding: 15px; 
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.1);
            line-height: 1.4;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💊 Favipiravir Calculator</h1>
        <p>แอปคำนวณขนาดยา (อ้างอิง CPG และตาราง รพ.)</p>
    </div>

    <!-- ส่วนกรอกข้อมูล -->
    <div class="form-group">
        <label>รูปแบบยา (Dosage Form)</label>
        <div class="radio-group" id="formGroup">
            <label class="radio-card active" onclick="setFormType('tablet')">
                <input type="radio" name="drugForm" value="tablet" checked>
                <span>💊 ยาเม็ด<br>(200 mg/tab)</span>
            </label>
            <label class="radio-card" onclick="setFormType('suspension')">
                <input type="radio" name="drugForm" value="suspension">
                <span>💧 ยาน้ำสำหรับเด็ก<br>(100 mg/ml)</span>
            </label>
        </div>
    </div>

    <div class="form-group">
        <label>น้ำหนักตัวผู้ป่วย (kg)</label>
        <input type="number" id="weight" step="0.1" min="1" placeholder="ระบุน้ำหนัก (กก.)">
    </div>

    <button onclick="calculateDose()">คำนวณขนาดยา</button>

    <!-- ส่วนแสดงผลลัพธ์ -->
    <div class="result-box" id="resultArea">
        <div class="dosage-card" id="cardDay1">
            <div class="dose-title">📅 วันที่ 1 (Loading Dose)</div>
            <div class="dose-detail">
                <div class="dose-mg"><span id="valMgD1">-</span> mg <br>รับประทาน <b>ทุก 12 ชม.</b></div>
                <div class="dose-val"><span id="valUnitD1">-</span> <span class="dose-unit" id="txtUnit1"></span><br><span style="font-size:12px; font-weight:normal; color:#64748b;">(มื้อละ)</span></div>
            </div>
        </div>

        <div class="dosage-card day2-5" id="cardDay2">
            <div class="dose-title">📅 วันที่ 2 - 5 (Maintenance)</div>
            <div class="dose-detail">
                <div class="dose-mg"><span id="valMgD2">-</span> mg <br>รับประทาน <b>ทุก 12 ชม.</b></div>
                <div class="dose-val"><span id="valUnitD2">-</span> <span class="dose-unit" id="txtUnit2"></span><br><span style="font-size:12px; font-weight:normal; color:#64748b;">(มื้อละ)</span></div>
            </div>
        </div>
        
        <div class="total-box">
            <div class="total-title" id="txtTotalTitle">ปริมาตรรวมที่ต้องใช้ (คอร์ส 5 วัน)</div>
            <div class="total-num" id="valTotal">-</div>
            
            <!-- กล่องแสดงจำนวนขวดที่ต้องจ่าย (จะซ่อนไว้ถ้าเป็นยาเม็ด) -->
            <div id="bottleArea" style="display:none;">
                <div class="bottle-dispense" id="valBottles">-</div>
            </div>
        </div>
    </div>
</div>

<script>
    // สลับรูปแบบยา เม็ด/น้ำ
    let currentForm = 'tablet';

    function setFormType(type) {
        currentForm = type;
        const cards = document.querySelectorAll('.radio-card');
        cards.forEach(card => card.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('resultArea').style.display = 'none';
        
        const wtInput = document.getElementById('weight');
        if(type === 'suspension') {
            wtInput.placeholder = "น้ำหนักเด็ก (ตัดที่ 50 กก.)";
            document.getElementById('txtTotalTitle').innerText = "ปริมาตรรวมที่ต้องใช้ (คอร์ส 5 วัน)";
        } else {
            wtInput.placeholder = "ระบุน้ำหนัก (กก.)";
            document.getElementById('txtTotalTitle').innerText = "จำนวนยาเม็ดรวมที่ต้องจ่าย (คอร์ส 5 วัน)";
        }
    }

    function calculateDose() {
        const weightInput = document.getElementById('weight').value;
        if (!weightInput || weightInput <= 0) {
            alert("กรุณาระบุน้ำหนักตัวให้ถูกต้อง");
            return;
        }

        const wt = parseFloat(weightInput);
        
        let mgDay1, mgDay2;
        let unitDay1, unitDay2;
        let totalVal, unitText;
        let bottleText = "";

        if (currentForm === 'tablet') {
            unitText = "เม็ด";
            if (wt < 90) {
                mgDay1 = 1800; unitDay1 = 9;   
                mgDay2 = 800;  unitDay2 = 4;   
            } else {
                mgDay1 = 2400; unitDay1 = 12;  
                mgDay2 = 1000; unitDay2 = 5;   
            }
            totalVal = (unitDay1 * 2) + (unitDay2 * 8) + " เม็ด";
            document.getElementById('bottleArea').style.display = 'none';

        } else if (currentForm === 'suspension') {
            unitText = "ml";
            document.getElementById('bottleArea').style.display = 'block';

            let calcWt = wt;
            if (wt > 50) {
                alert("ยาน้ำในตารางรองรับน้ำหนักสูงสุดที่ 50 kg หากน้ำหนักมากกว่านี้แนะนำให้ใช้ยาเม็ดครับ");
                calcWt = 50; 
                document.getElementById('weight').value = 50;
            }

            // คำนวณ mg (Day1: 35 mg/kg, Day2: 15 mg/kg)
            mgDay1 = Math.round(calcWt * 35);
            mgDay2 = Math.round(calcWt * 15);

            // คำนวณเป็น ml และปัดเศษทศนิยม 1 ตำแหน่ง (เช่น 1.05 ปัดเป็น 1.1)
            unitDay1 = (Math.round((calcWt * 35) / 10) / 10).toFixed(1);
            unitDay2 = (Math.round((calcWt * 15) / 10) / 10).toFixed(1);
            
            // แปลงกลับเป็นตัวเลขเพื่อง่ายต่อการคำนวณผลรวม
            let calcUnitDay1 = parseFloat(unitDay1);
            let calcUnitDay2 = parseFloat(unitDay2);

            // ปริมาตรรวม 5 วัน
            let totalVolume = (calcUnitDay1 * 2) + (calcUnitDay2 * 8);
            totalVolume = parseFloat(totalVolume.toFixed(1)); 
            
            totalVal = totalVolume + " ml";

            // คำนวณจำนวนขวดจ่ายยาเผื่อ Loss ตามตาราง
            let b30 = 0;
            let b60 = 0;
            
            if (calcWt <= 15) {
                b30 = 1;
            } else if (calcWt <= 30) {
                b60 = 1;
            } else if (calcWt <= 46) {
                b30 = 1; b60 = 1;
            } else if (calcWt <= 50) {
                b60 = 2;
            }

            let bTextArr = [];
            if (b30 > 0) bTextArr.push(`30 ml จำนวน ${b30} ขวด`);
            if (b60 > 0) bTextArr.push(`60 ml จำนวน ${b60} ขวด`);
            
            // เปลี่ยนข้อความและทำให้เด่นขึ้น
            bottleText = "📦 จ่ายยาขนาด<br>" + bTextArr.join(' + ');
        }

        // แสดงผล
        document.getElementById('valMgD1').innerText = mgDay1;
        document.getElementById('valUnitD1').innerText = unitDay1;
        document.getElementById('txtUnit1').innerText = unitText;

        document.getElementById('valMgD2').innerText = mgDay2;
        document.getElementById('valUnitD2').innerText = unitDay2;
        document.getElementById('txtUnit2').innerText = unitText;

        document.getElementById('valTotal').innerText = totalVal;
        
        if (currentForm === 'suspension') {
            document.getElementById('valBottles').innerHTML = bottleText;
        }

        document.getElementById('resultArea').style.display = 'block';
    }
</script>

</body>
</html>
