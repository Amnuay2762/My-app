<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์ตารางเวรดึกอัตโนมัติ V2</title>
    <!-- โหลดไลบรารี SheetJS สำหรับอ่านไฟล์ Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1e3a8a; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        
        .upload-box {
            border: 2px dashed #3b82f6; background-color: #eff6ff; padding: 40px; text-align: center;
            border-radius: 12px; cursor: pointer; transition: 0.3s; margin: 20px 0;
        }
        .upload-box:hover { background-color: #dbeafe; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        
        .card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; }
        .card h2 { color: #2563eb; font-size: 18px; margin-top: 0; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; font-size: 14px; }
        
        .badge { background: #3b82f6; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        #status { font-weight: bold; margin-top: 15px; color: #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 ระบบวิเคราะห์-จับคู่เวรดึกอัตโนมัติ</h1>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">📁</div>
        <h3>คลิกที่นี่เพื่ออัปโหลดไฟล์ Excel (ตารางเวร)</h3>
        <p style="color: #64748b;">รองรับไฟล์ .xlsx ทุกรูปแบบ ระบบจะสแกนหา "ดึก I" อัตโนมัติ</p>
        <input type="file" id="fileInput" accept=".xlsx, .xls" style="display: none;">
        <div id="status">รอการอัปโหลดไฟล์...</div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>🏆 คู่ที่อยู่เวรดึกด้วยกันบ่อยที่สุด</h2>
            <div id="pairResult" style="overflow-x:auto;">(ข้อมูลจะแสดงที่นี่)</div>
        </div>

        <div class="card">
            <h2>👤 จำนวนเวรดึกรวมรายบุคคล</h2>
            <div id="staffResult" style="overflow-x:auto; height: 350px;">(ข้อมูลจะแสดงที่นี่)</div>
        </div>
    </div>
</div>

<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
    let statusText = document.getElementById('status');
    const file = e.target.files[0];
    if (!file) return;

    statusText.style.color = "#ea580c";
    statusText.innerText = "⏳ กำลังประมวลผลไฟล์: " + file.name;

    const reader = new FileReader();

    reader.onload = function(event) {
        try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            let globalPairs = {};
            let globalStaff = {};

            // วนลูปอ่านทุกๆ เดือน (Sheet) ในไฟล์ Excel
            workbook.SheetNames.forEach(sheetName => {
                const sheet = workbook.Sheets[sheetName];
                // แปลงข้อมูลเป็นอาเรย์ 2 มิติ (Defval ป้องกันช่องว่างเป็น undefined)
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

                // สร้างหน่วยความจำเก็บว่า แต่ละคอลัมน์ (วัน) มีชื่อใครบ้าง
                let dailyNightShift = {};
                for(let i = 1; i <= 40; i++) { dailyNightShift[i] = new Set(); } 

                let currentName = ""; // ตัวแปรจำชื่อพนักงานปัจจุบัน

                rows.forEach(row => {
                    let colA = String(row[0]).trim();

                    // เช็คว่า คอลัมน์แรก เป็น "ชื่อพนักงาน" หรือไม่ (มีตัวอักษร, ไม่ใช่ NaN, ไม่ใช่หัวตาราง)
                    if (colA && colA !== "NaN" && /[ก-๙a-zA-Z]/.test(colA) && !colA.includes("รวม") && !colA.includes("หยุด") && !colA.includes("พนักงาน")) {
                        currentName = colA; // จำชื่อพนักงานคนนี้ไว้
                    }

                    // ถ้ายังไม่มีชื่อคนให้ข้ามไป (พวกหัวกระดาษ)
                    if (!currentName) return;

                    // วนเช็คทุกคอลัมน์ในบรรทัดเดียวกัน (เผื่อเจอคำว่า "ดึก")
                    for (let c = 1; c <= 35; c++) {
                        let cellData = String(row[c] || "").trim();
                        // ถ้าเจอคำว่า ดึก (เช่น "ดึก I") ให้เอาชื่อไปผูกกับคอลัมน์นั้น
                        if (cellData.includes("ดึก")) {
                            dailyNightShift[c].add(currentName);
                        }
                    }
                });

                // --- นำข้อมูลแต่ละวันมาประมวลผลเป็น "คู่" ---
                for (let c = 1; c <= 40; c++) {
                    let people = Array.from(dailyNightShift[c]);
                    
                    // นับยอดรวมเวรดึกรายบุคคล
                    people.forEach(person => {
                        globalStaff[person] = (globalStaff[person] || 0) + 1;
                    });

                    // นับยอดการจับคู่กัน
                    if (people.length >= 2) {
                        people.sort(); // เรียงชื่อ ก-ฮ ป้องกัน A+B กับ B+A สลับกัน
                        for (let i = 0; i < people.length; i++) {
                            for (let j = i + 1; j < people.length; j++) {
                                let pairName = people[i] + " คู่กับ " + people[j];
                                globalPairs[pairName] = (globalPairs[pairName] || 0) + 1;
                            }
                        }
                    }
                }
            });

            // แสดงผลหน้าจอ
            displayResults(globalPairs, globalStaff);
            statusText.style.color = "#16a34a";
            statusText.innerText = "✅ วิเคราะห์ข้อมูลสำเร็จแล้ว!";
            
        } catch (error) {
            statusText.style.color = "red";
            statusText.innerText = "❌ เกิดข้อผิดพลาดในการอ่านไฟล์: " + error.message;
            console.error(error);
        }
    };

    reader.readAsArrayBuffer(file);
});

function displayResults(pairs, staff) {
    // เรนเดอร์ตารางจัดอันดับคู่
    let pairHtml = "<table><tr><th>ชื่อคู่เวรดึก</th><th style='text-align:right;'>ครั้ง</th></tr>";
    
    // แปลง Object เป็น Array เพื่อเรียงลำดับจากมากไปน้อย
    let sortedPairs = Object.keys(pairs).sort((a, b) => pairs[b] - pairs[a]);
    
    if (sortedPairs.length === 0) {
        pairHtml += "<tr><td colspan='2' style='color:#ef4444;'>ไม่พบข้อมูลเวรดึก (โปรดตรวจสอบไฟล์)</td></tr>";
    } else {
        sortedPairs.forEach(key => {
            pairHtml += `<tr><td>${key}</td><td style='text-align:right;'><span class="badge">${pairs[key]}</span></td></tr>`;
        });
    }
    document.getElementById('pairResult').innerHTML = pairHtml + "</table>";

    // เรนเดอร์ยอดรายบุคคล
    let staffHtml = "<table><tr><th>ชื่อเจ้าหน้าที่</th><th style='text-align:right;'>รวมเวรดึก</th></tr>";
    let sortedStaff = Object.keys(staff).sort((a, b) => staff[b] - staff[a]);
    
    sortedStaff.forEach(key => {
        staffHtml += `<tr><td>${key}</td><td style='text-align:right;'>${staff[key]} กะ</td></tr>`;
    });
    document.getElementById('staffResult').innerHTML = staffHtml + "</table>";
}
</script>

</body>
</html>
